<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>呼吸道管理臨床訓練</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,700;1,400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--surface:#161b22;--surface2:#1c2230;--surface3:#21283a;
  --teal:#2dd4bf;--teal-dim:#1a8a7a;--teal-glow:rgba(45,212,191,0.15);
  --text:#e6edf3;--text-dim:#8b949e;--text-faint:#484f58;
  --correct:#3fb950;--correct-bg:rgba(63,185,80,0.1);
  --wrong:#f85149;--wrong-bg:rgba(248,81,73,0.1);
  --warn:#d29922;--border:#30363d;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans TC',sans-serif}

/* LAYOUT */
#app{max-width:860px;margin:0 auto;padding:24px 16px;min-height:100vh}

/* HEADER */
.game-header{text-align:center;padding:40px 0 32px}
.game-header h1{font-family:'Playfair Display',serif;font-size:clamp(24px,5vw,38px);color:#fff;letter-spacing:.02em}
.game-header p{color:var(--text-dim);margin-top:8px;font-size:14px}

/* STAGE NAV */
.stage-nav{display:flex;gap:8px;justify-content:center;margin-bottom:32px;flex-wrap:wrap}
.stage-dot{width:36px;height:36px;border-radius:50%;border:2px solid var(--border);background:var(--surface);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-family:'DM Mono',monospace;
  color:var(--text-dim);transition:.3s;position:relative}
.stage-dot.active{border-color:var(--teal);color:var(--teal);box-shadow:0 0 12px var(--teal-glow)}
.stage-dot.done{background:var(--teal-dim);border-color:var(--teal);color:#fff}
.stage-connector{width:20px;height:2px;background:var(--border);align-self:center;flex-shrink:0}
.stage-connector.done{background:var(--teal-dim)}

/* CARD */
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px;margin-bottom:20px}
.card-label{font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px}
.card-title{font-family:'Playfair Display',serif;font-size:22px;color:#fff;line-height:1.4;margin-bottom:8px}
.card-sub{color:var(--text-dim);font-size:13px;line-height:1.6}

/* QUESTION */
.q-counter{font-family:'DM Mono',monospace;font-size:11px;color:var(--text-dim);margin-bottom:6px}
.q-text{font-size:15px;line-height:1.7;color:var(--text);margin-bottom:20px;padding:16px;
  background:var(--surface2);border-radius:8px;border-left:3px solid var(--teal)}

/* OPTIONS */
.options{display:flex;flex-direction:column;gap:10px}
.opt{padding:14px 18px;border-radius:8px;border:1px solid var(--border);background:var(--surface2);
  cursor:pointer;font-size:14px;line-height:1.6;color:var(--text);transition:.2s;text-align:left}
.opt:hover:not(.disabled){border-color:var(--teal);background:var(--teal-glow);color:#fff}
.opt.correct{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.opt.wrong{border-color:var(--wrong);background:var(--wrong-bg);color:var(--wrong)}
.opt.reveal{border-color:var(--correct);background:var(--correct-bg);color:var(--correct)}
.opt.disabled{cursor:default;pointer-events:none}

/* ANALYSIS */
.analysis{margin-top:16px;padding:16px;background:var(--surface3);border-radius:8px;border:1px solid var(--border);
  font-size:13px;line-height:1.8;color:var(--text-dim);display:none}
.analysis.show{display:block}
.analysis strong{color:var(--teal);font-weight:500}

/* PROGRESS BAR */
.q-progress{height:3px;background:var(--border);border-radius:2px;margin-bottom:20px;overflow:hidden}
.q-progress-fill{height:100%;background:var(--teal);border-radius:2px;transition:.4s}

/* RING */
.ring-wrap{display:flex;flex-direction:column;align-items:center;padding:32px 0}
.ring-wrap svg{filter:drop-shadow(0 0 16px var(--teal-glow))}
.ring-score{font-family:'Playfair Display',serif;font-size:32px;color:#fff;margin-top:16px}
.ring-label{font-size:13px;color:var(--text-dim);margin-top:4px}
.results-list{margin-top:24px;display:flex;flex-direction:column;gap:8px}
.result-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;
  background:var(--surface2);border-radius:6px;font-size:13px}
.result-row .badge{font-family:'DM Mono',monospace;font-size:12px;padding:2px 8px;border-radius:4px}
.badge.good{background:var(--correct-bg);color:var(--correct)}
.badge.mid{background:rgba(210,153,34,.15);color:var(--warn)}
.badge.low{background:var(--wrong-bg);color:var(--wrong)}

/* FINAL */
.final-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:24px 0}
.final-cell{background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:16px;text-align:center}
.final-cell .num{font-family:'Playfair Display',serif;font-size:28px;color:var(--teal)}
.final-cell .lbl{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.4}

/* BTN */
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;border-radius:8px;
  border:none;cursor:pointer;font-size:14px;font-family:'Noto Sans TC',sans-serif;font-weight:500;transition:.2s}
.btn-primary{background:var(--teal);color:#0d1117}
.btn-primary:hover{background:#5eead4}
.btn-outline{background:transparent;border:1px solid var(--teal);color:var(--teal)}
.btn-outline:hover{background:var(--teal-glow)}
.btn-center{display:flex;justify-content:center;margin-top:24px;gap:12px}

/* NEXT HINT */
.next-hint{text-align:center;margin-top:12px;font-size:12px;color:var(--text-faint);display:none}
.next-hint.show{display:block}

/* SECTION FADE */
.section{animation:fadeIn .35s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* RESPONSIVE */
@media(max-width:600px){.card{padding:18px}.q-text{font-size:14px}.opt{font-size:13px}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ─── DATA ───────────────────────────────────────────────────────────────────
const STAGES = [
{
  id:1,
  title:"呼吸道評估與策略制定",
  subtitle:"困難氣道預測因子・清醒插管適應症・設備準備",
  qs:[
    {
      text:"一位 62 歲男性，BMI 38，Mallampati III 級，頸部活動度受限（頸椎手術後），開口度 3.5 cm，甲頦距離 5 cm。麻醉前評估最重要的下一步是？",
      opts:["直接安排全身麻醉快速誘導（RSI）","告知病人清醒插管計畫，取得知情同意","先完成術前 X 光再決定","預訂較小號的 ETT 即可"],

    },
    {

      opts:["Edema（水腫）","Evaluation（3-3-2 法則）","Emergency（緊急程度）","Epiglottis（會厭可視性）"],
      ans:1,
      analysis:"<strong>LEMON 法則</strong>：L＝Look externally（外觀評估）、E＝Evaluate（3-3-2 法則：開口 3 指、甲頦距離 3 指、甲舌骨距離 2 指）、M＝Mallampati、O＝Obstruction（氣道阻塞）、N＝Neck mobility（頸部活動度）。3-3-2 任一不符合即提示困難喉鏡暴露。"

      analysis:"<strong>氣管內局部麻醉</strong>：環甲膜穿刺（transtracheal block）注入 2-4 mL 2-4% Lidocaine，病人吸氣時注射可使藥物被吸入聲門以下，麻醉聲帶下方及氣管黏膜，減少插管刺激。上喉神經阻斷麻醉聲帶上方及會厭；舌神經阻斷覆蓋舌後 1/3；口咽噴霧主要覆蓋口咽。三者合用可達完整上呼吸道麻醉。"
    },
    {
      text:"困難氣道車（difficult airway cart）必備設備中，屬於「救援」（rescue）裝置的是？",
      opts:["Macintosh 直接喉鏡備用葉片","探條（bougie）","環甲切開套件（surgical airway kit）","加長型吸引管"],
      ans:2,
      analysis:"<strong>氣道設備分層</strong>：困難氣道車設備依功能分層：第一線（喉鏡、插管管、探條）→ 第二線（SGA：LMA、i-gel）→ 救援裝置（外科氣道）。環甲切開套件（含 scalpel、bougie、cuffed ETT 或商業套件）屬於 CICO 情況下最後手段，必須置於易取得位置。"

      text:"Mallampati 分級評估時，病人應採取什麼姿勢才能得到最準確的結果？",

      ans:1,
      analysis:"<strong>Mallampati 標準評估法</strong>：病人坐直或直立，頭部保持中立（不後仰、不前屈），張口至最大，不發聲。發聲會使軟顎上提，人為地改善分級結果（可能從 III 降為 II）。後仰同樣會改善暴露，低估困難度。標準化姿勢確保評估的再現性與可比較性。"

{
  id:2,
  title:"預先給氧與誘導流程",

      ans:1,
      analysis:"<strong>預給氧目標</strong>：EtO₂（end-tidal O₂）≥90% 是公認標準，代表功能殘氣量（FRC）中 N₂ 已被充分清洗（氮氣洗出，nitrogen washout）。達此目標後，健康成人可提供約 8 分鐘的安全呼吸暫停時間（apnoeic oxygenation 配合高流量 O₂ 可進一步延長）。僅監測 SpO₂ 到 99% 不代表 FRC 已完成清洗，無法反映氧氣儲備量。"
    },
    {
      text:"BMI 42 的病人進行 RSI 前，最佳體位為？",

      ans:1,
      analysis:"<strong>肥胖病人體位</strong>：Ramped position（傾斜位）使外耳道與胸骨切跡齊平，通過將肩膀及上軀幹墊高（毯子堆疊或使用 HELP 枕）實現。此體位：①改善喉鏡暴露視野；②增加 FRC，延長安全呼吸暫停時間（肥胖者 FRC 顯著降低）；③降低誤吸風險（胃食道逆流壓力梯度較小）。"
    },
    {
      text:"現代 RSI（rapid sequence induction）概念中，下列哪項已被重新評估而不再視為絕對要素？",

      ans:1,
      analysis:"<strong>RSI 現代修正</strong>：傳統 RSI 嚴格禁止面罩通氣，以避免胃充氣增加誤吸風險。然而現代共識（包括 DAS 2015 guideline 及多個研究）認為：若預給氧不足或 SpO₂ 快速下降，輕柔的面罩通氣（&lt;20 cmH₂O）風險遠低於嚴重低氧。「Modified RSI」允許低壓輔助通氣。禁止面罩通氣已不再被視為現代 RSI 的絕對要求。"
    },
    {
      text:"關於環狀軟骨壓迫（Sellick's manoeuvre），目前最符合實證的說法是？",
      opts:["所有飽胃病人皆應常規施行，效果確定","可降低誤吸風險，但也可能惡化喉鏡視野，且有效性證據薄弱","壓迫力道應達 44 N 以確保食道完全閉合","清醒時不需要，只在誘導後施行"],
      ans:1,
      analysis:"<strong>環狀軟骨壓迫爭議</strong>：Sellick 原始描述（1961）建議清醒時施加 10 N、誘導後 30-44 N 的壓力。然而後續 MRI 研究顯示：食道位置並非總在正中線，壓迫效果因人而異。多個 RCT 及 Cochrane review 指出有效性證據薄弱，且可能惡化聲門視野、影響 LMA 置放及 FRC。目前觀點：可選擇性使用，若影響插管應立即解除，並非強制性措施。"
    },

      opts:["Succinylcholine 提供更長的肌松時間，適合預期困難氣道","Rocuronium 1.2 mg/kg 可用 Sugammadex 16 mg/kg 快速逆轉，在困難氣道情境下是優勢","Rocuronium 標準劑量 0.6 mg/kg 即可達 RSI 要求","兩者插管條件相同但 Succinylcholine 無藥物禁忌症"],

{
  id:3,
  title:"插管技術與失敗處置",
  subtitle:"視訊喉鏡 JAMA 2024・DAS 2025 計畫 A-D・CICO・波形 CO₂",
  qs:[

      opts:["視訊喉鏡在所有情境下首次插管成功率均顯著較高","視訊喉鏡可改善 ICU 及急診高風險病人的首次插管成功率，但 OR 中常規使用的絕對優勢證據仍有爭議","直接喉鏡在困難氣道情境下仍優於視訊喉鏡","視訊喉鏡主要優勢是縮短插管時間而非提升成功率"],

      ans:1,

// ─── STATE ───────────────────────────────────────────────────────────────────
const state={
  screen:'home', // home | stage | stageResult | final
  stageIdx:0,
  qIdx:0,
  answered:false,
  scores:[0,0,0,0,0],
  stageAnswers:[], // per question: true/false
  allAnswers:[]   // array of arrays
};

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function $(id){return document.getElementById(id)}
function render(){
  const app=document.getElementById('app');
  if(state.screen==='home') app.innerHTML=renderHome();
  else if(state.screen==='stage') app.innerHTML=renderStage();
  else if(state.screen==='stageResult') app.innerHTML=renderStageResult();
  else if(state.screen==='final') app.innerHTML=renderFinal();
  bindEvents();
}

function pct(n,total){return total===0?0:Math.round(n/total*100)}

function ringPath(r,score,total){
  const p=score/total;
  const circ=2*Math.PI*36;
  const dash=circ*p;
  return dash+' '+(circ-dash);
}

function scoreColor(s,t){
  const p=s/t;
  if(p>=0.8) return 'good';
  if(p>=0.6) return 'mid';
  return 'low';
}
function scoreLabel(s,t){
  const p=s/t;
  if(p>=0.8) return '優秀';
  if(p>=0.6) return '及格';
  return '需加強';
}

function navDots(){
  let h='';
  STAGES.forEach((s,i)=>{
    const done=i<state.stageIdx||(state.screen==='final');
    const active=i===state.stageIdx&&state.screen==='stage';
    const cls=done?'stage-dot done':active?'stage-dot active':'stage-dot';
    h+=`<div class="${cls}">${done?'✓':(i+1)}</div>`;
    if(i<STAGES.length-1){
      h+=`<div class="stage-connector ${done?'done':''}"></div>`;
    }
  });
  return `<div class="stage-nav">${h}</div>`;
}

// ─── SCREENS ─────────────────────────────────────────────────────────────────
function renderHome(){
  return `<div class="section">
  <div class="game-header">
    <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);letter-spacing:.15em;margin-bottom:12px">AIRWAY MANAGEMENT TRAINING</div>
    <h1>呼吸道管理<br>臨床訓練</h1>
    <p style="margin-top:12px">5 關・各 5 題・情境選擇題・含臨床解析</p>
  </div>
  <div class="card">
    <div class="card-label">關卡總覽</div>
    ${STAGES.map((s,i)=>`
    <div style="display:flex;align-items:flex-start;gap:14px;padding:12px 0;${i<STAGES.length-1?'border-bottom:1px solid var(--border)':''}">
      <div style="min-width:28px;height:28px;border-radius:50%;background:var(--teal-dim);display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:12px;color:#fff;flex-shrink:0">${i+1}</div>
      <div>
        <div style="font-weight:500;font-size:14px;margin-bottom:2px">${s.title}</div>
        <div style="font-size:12px;color:var(--text-dim)">${s.subtitle}</div>
      </div>
    </div>`).join('')}
  </div>
  <div class="btn-center">
    <button class="btn btn-primary" id="startBtn">開始訓練</button>
  </div>
  </div>`;
}

function renderStage(){
  const stage=STAGES[state.stageIdx];
  const q=stage.qs[state.qIdx];
  const prog=((state.qIdx)/stage.qs.length)*100;
  return `<div class="section">
  ${navDots()}
  <div class="card" style="border-color:var(--teal-dim)">
    <div class="card-label">關卡 ${state.stageIdx+1} / ${STAGES.length}</div>
    <div class="card-title">${stage.title}</div>
    <div class="card-sub">${stage.subtitle}</div>
  </div>
  <div class="q-progress"><div class="q-progress-fill" style="width:${prog}%"></div></div>
  <div class="card">
    <div class="q-counter">問題 ${state.qIdx+1} / ${stage.qs.length}</div>
    <div class="q-text">${q.text}</div>
    <div class="options" id="opts">
      ${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}
    </div>
    <div class="analysis" id="analysis">${q.analysis}</div>
  </div>
  <div class="next-hint" id="nextHint" style="display:none">
    <button class="btn btn-outline" id="nextBtn" style="margin:0 auto">${state.qIdx<stage.qs.length-1?'下一題 →':'查看本關結果 →'}</button>
  </div>
  </div>`;
}

function renderRing(score,total){
  const circ=2*Math.PI*36;
  const p=score/total;
  const dash=circ*p;
  const color=p>=0.8?'var(--correct)':p>=0.6?'var(--warn)':'var(--wrong)';
  return `<svg width="100" height="100" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="36" fill="none" stroke="var(--border)" stroke-width="8"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="${color}" stroke-width="8"
      stroke-dasharray="${dash} ${circ-dash}" stroke-dashoffset="${circ/4}"
      stroke-linecap="round" transform="rotate(-90 50 50)" style="transition:stroke-dasharray 0.8s ease"/>
    <text x="50" y="54" text-anchor="middle" font-family="Playfair Display,serif" font-size="20" fill="#fff">${score}/${total}</text>
  </svg>`;
}

function renderStageResult(){
  const stage=STAGES[state.stageIdx];
  const score=state.scores[state.stageIdx];
  const total=stage.qs.length;
  const isLast=state.stageIdx===STAGES.length-1;
  return `<div class="section">
  ${navDots()}
  <div class="card">
    <div class="card-label">關卡 ${state.stageIdx+1} 結果</div>
    <div class="card-title">${stage.title}</div>
  </div>
  <div class="card">
    <div class="ring-wrap">${renderRing(score,total)}
      <div class="ring-score">${score} / ${total}</div>
      <div class="ring-label">${scoreLabel(score,total)} · 正確率 ${pct(score,total)}%</div>
    </div>
    <div class="results-list">
      ${stage.qs.map((q,i)=>{
        const ok=state.stageAnswers[i];
        return `<div class="result-row">
          <span style="font-size:13px">Q${i+1}. ${q.opts[q.ans].substring(0,30)}…</span>
          <span class="badge ${ok?'good':'low'}">${ok?'✓ 正確':'✗ 錯誤'}</span>
        </div>`;
      }).join('')}
    </div>
  </div>
  <div class="btn-center">
    <button class="btn btn-primary" id="nextStageBtn">${isLast?'查看總成績 →':'下一關 →'}</button>
  </div>
  </div>`;
}

function renderFinal(){
  const total=STAGES.reduce((a,s)=>a+s.qs.length,0);
  const totalScore=state.scores.reduce((a,b)=>a+b,0);
  const overall=pct(totalScore,total);
  return `<div class="section">
  <div class="game-header">
    <div style="font-family:'DM Mono',monospace;font-size:11px;color:var(--teal);letter-spacing:.15em;margin-bottom:12px">TRAINING COMPLETE</div>
    <h1>訓練完成</h1>
  </div>
  <div class="card" style="text-align:center">
    <div class="ring-wrap">${renderRing(totalScore,total)}
      <div class="ring-score">${totalScore} / ${total}</div>
      <div class="ring-label">整體正確率 ${overall}%</div>
    </div>
    <div style="margin-top:8px;font-size:14px;color:var(--text-dim)">
      ${overall>=80?'臨床判斷力優秀，繼續保持。':overall>=60?'基礎穩固，建議複習錯誤題目的臨床解析。':'建議搭配指引文件重新複習各關卡重點。'}
    </div>
  </div>
  <div class="card">
    <div class="card-label">各關成績</div>
    <div class="final-grid">
      ${STAGES.map((s,i)=>`
      <div class="final-cell">
        <div class="num" style="color:${state.scores[i]/s.qs.length>=0.8?'var(--correct)':state.scores[i]/s.qs.length>=0.6?'var(--warn)':'var(--wrong)'}">${state.scores[i]}/${s.qs.length}</div>
        <div class="lbl">關卡 ${i+1}<br>${s.title.substring(0,8)}…</div>
      </div>`).join('')}
    </div>
  </div>
  <div class="btn-center">
    <button class="btn btn-outline" id="restartBtn">重新開始</button>
  </div>
  </div>`;
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
function bindEvents(){
  const startBtn=$('startBtn');
  if(startBtn) startBtn.addEventListener('click',()=>{
    state.screen='stage';state.stageIdx=0;state.qIdx=0;
    state.answered=false;state.stageAnswers=[];render();
  });

  const opts=document.querySelectorAll('.opt');
  opts.forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(state.answered) return;
      state.answered=true;
      const chosen=parseInt(btn.dataset.i);
      const stage=STAGES[state.stageIdx];
      const q=stage.qs[state.qIdx];
      const correct=chosen===q.ans;
      if(correct){
        state.scores[state.stageIdx]++;
        state.stageAnswers.push(true);
      } else {
        state.stageAnswers.push(false);
      }
      opts.forEach((b,i)=>{
        b.classList.add('disabled');
        if(i===q.ans) b.classList.add('correct');
        else if(i===chosen&&!correct) b.classList.add('wrong');
      });
      const analysis=$('analysis');
      if(analysis) analysis.classList.add('show');
      const hint=$('nextHint');
      if(hint) hint.style.display='block';
      const nextBtn=$('nextBtn');
      if(nextBtn) nextBtn.addEventListener('click',goNext);
    });
  });

  const nextStageBtn=$('nextStageBtn');
  if(nextStageBtn) nextStageBtn.addEventListener('click',()=>{
    if(state.stageIdx===STAGES.length-1){
      state.screen='final';render();
    } else {
      state.stageIdx++;state.qIdx=0;state.answered=false;state.stageAnswers=[];
      state.screen='stage';render();
    }
  });

  const restartBtn=$('restartBtn');
  if(restartBtn) restartBtn.addEventListener('click',()=>{
    state.screen='home';state.stageIdx=0;state.qIdx=0;
    state.answered=false;state.scores=[0,0,0,0,0];
    state.stageAnswers=[];state.allAnswers=[];render();
  });
}

function goNext(){
  const stage=STAGES[state.stageIdx];
  if(state.qIdx<stage.qs.length-1){
    state.qIdx++;state.answered=false;state.screen='stage';render();
  } else {
    state.screen='stageResult';render();
  }
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
